<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Código QR con Logo</title>
  <meta name="description" content="Genera códigos QR desde un enlace, con logo opcional en el centro, y descargalos en PNG.">
  <style>
    :root {
      --bg-1: #f3f8ff;
      --bg-2: #dce8ff;
      --card: #ffffff;
      --text: #182230;
      --muted: #5a6b82;
      --primary: #155eef;
      --primary-strong: #004ee8;
      --shadow: 0 20px 50px rgba(21, 94, 239, 0.2);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, #b6d0ff 0, transparent 35%),
        radial-gradient(circle at 85% 80%, #8ec5ff 0, transparent 30%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
    }

    .app {
      width: min(760px, 100%);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(1.2rem, 3.5vw, 2.2rem);
      border: 1px solid #e5edff;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2rem);
      letter-spacing: 0.01em;
    }

    .subtitle {
      margin-top: 0.5rem;
      margin-bottom: 1.25rem;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .form-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    #linkInput {
      flex: 1;
      min-width: 200px;
      border-radius: 12px;
      border: 1px solid #bfd3ff;
      padding: 0.85rem 0.95rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      color: var(--text);
      background: #fbfdff;
    }

    #linkInput:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(21, 94, 239, 0.14);
    }

    /* Input de archivo accesible: label estilizado como botón */
    .file-input-btn {
      border: 1px solid #bfd3ff;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary);
      background: #eef4ff;
      cursor: pointer;
      display: inline-block;
      transition: all 0.2s ease;
    }

    .file-input-btn:hover {
      background: #dbe8ff;
    }

    .file-input-btn:focus-visible {
      outline: 3px solid rgba(21, 94, 239, 0.4);
      outline-offset: 2px;
    }

    /* Input real oculto visualmente pero accesible */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      white-space: nowrap;
    }

    button:hover {
      filter: brightness(1.03);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #a0b8e0;
      cursor: not-allowed;
      transform: none;
    }

    .qr-wrap {
      margin-top: 1.35rem;
      border-radius: 16px;
      border: 1px dashed #bfd3ff;
      background: #f9fbff;
      min-height: 310px;
      display: grid;
      place-items: center;
      padding: 1rem;
      position: relative;
    }

    #placeholder {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .qr-container {
      display: inline-block;
    }

    #qrcode {
      display: grid;
      place-items: center;
    }

    #qrcode img,
    #qrcode canvas {
      border-radius: 10px;
      box-shadow: 0 10px 26px rgba(0, 38, 120, 0.18);
      background: #fff;
      padding: 0.65rem;
    }

    .action-buttons {
      margin-top: 1.25rem;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .logo-tools {
      margin-top: 1rem;
      border: 1px solid #bfd3ff;
      border-radius: 14px;
      padding: 0.9rem 1rem 1rem;
      background: #f6f9ff;
    }

    .logo-tools legend {
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0 0.4rem;
    }

    .logo-tools label {
      display: grid;
      gap: 0.3rem;
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 0.7rem;
    }

    .logo-tools output {
      font-weight: 700;
      color: var(--primary);
    }

    .logo-tools input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    .logo-tools .check-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-tools .check-row input {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: var(--primary);
    }

    .link-btn {
      background: none;
      color: var(--primary);
      padding: 0.4rem 0;
      font-size: 0.9rem;
      text-decoration: underline;
    }

    .row-2 {
      display: flex;
      gap: 0.7rem;
    }

    .row-2 > label {
      flex: 1;
      min-width: 0;
    }

    .logo-tools select {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #bfd3ff;
      padding: 0.6rem 0.7rem;
      font-size: 0.95rem;
      color: var(--text);
      background: #fff;
    }

    .logo-tools input[type="color"] {
      width: 100%;
      height: 2.6rem;
      border: 1px solid #bfd3ff;
      border-radius: 10px;
      padding: 0.15rem 0.25rem;
      background: #fff;
      cursor: pointer;
    }

    .hint {
      font-size: 0.82rem;
      color: var(--muted);
      margin: 0.2rem 0 0.6rem;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.55rem;
      margin-bottom: 0.8rem;
    }

    .swatch {
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 0;
      cursor: pointer;
      background: none;
      display: grid;
      gap: 0.25rem;
      justify-items: center;
    }

    .swatch span {
      width: 100%;
      height: 2.2rem;
      border-radius: 10px;
      border: 1px solid #bfd3ff;
      display: block;
    }

    .swatch small {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 600;
    }

    .swatch[aria-pressed="true"] span {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(21, 94, 239, 0.35);
    }

    @media (max-width: 560px) {
      .app {
        border-radius: 18px;
        padding: 1rem;
      }

      .form-row {
        flex-direction: column;
        align-items: stretch;
      }

      #linkInput {
        min-width: 0;
      }

      button, .file-input-btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <main class="app">
    <h1>Generador de Código QR</h1>
    <p class="subtitle">Escribe un enlace, sube un logo (opcional) y descarga tu QR personalizado.</p>

    <div class="form-row">
      <input type="url" id="linkInput" placeholder="https://example.com" inputmode="url" autocomplete="url" aria-label="Enlace para el código QR">
      
      <!-- Label accesible que dispara el input de archivo -->
      <label class="file-input-btn" for="logoInput">📁 Subir Logo</label>
      <input type="file" id="logoInput" class="sr-only" accept="image/*">

      <button type="button" id="generateBtn">Generar QR</button>
    </div>

    <p id="logoStatus" role="status" aria-live="polite" style="font-size:0.9rem;color:var(--muted);margin:0.6rem 0 0;"></p>

    <fieldset id="logoTools" class="logo-tools" hidden>
      <legend>Herramientas del logo</legend>
      <label for="logoSize">Tamaño del logo: <output id="logoSizeVal" for="logoSize">40%</output>
        <input type="range" id="logoSize" min="0.2" max="0.5" step="0.05" value="0.4" aria-describedby="logoSizeVal">
      </label>
      <label for="logoMargin">Margen alrededor: <output id="logoMarginVal" for="logoMargin">8px</output>
        <input type="range" id="logoMargin" min="0" max="20" step="1" value="8" aria-describedby="logoMarginVal">
      </label>
      <label class="check-row" for="hideDots">
        <input type="checkbox" id="hideDots" checked>
        Ocultar puntos detrás del logo (más legible)
      </label>
      <button type="button" id="removeLogoBtn" class="link-btn">Quitar logo</button>
    </fieldset>

    <fieldset id="styleTools" class="logo-tools">
      <legend>Estilo y efectos</legend>

      <label>Paletas Materialize:
        <span class="hint">Un clic aplica puntos + ojos + fondo. Después podés ajustar fino abajo.</span>
      </label>
      <div class="palette-grid" id="paletteGrid" role="group" aria-label="Paletas de color Materialize"></div>

      <div class="row-2">
        <label for="dotType">Estilo de puntos:
          <select id="dotType">
            <option value="rounded" selected>Redondeados</option>
            <option value="square">Cuadrados</option>
            <option value="dots">Círculos</option>
            <option value="classy">Classy</option>
            <option value="classy-rounded">Classy redondeado</option>
            <option value="extra-rounded">Extra redondeados</option>
          </select>
        </label>
        <label for="dotColor">Color de puntos:
          <input type="color" id="dotColor" value="#182230">
        </label>
      </div>

      <label class="check-row" for="useGradient">
        <input type="checkbox" id="useGradient">
        Degradado en puntos
      </label>
      <div id="gradientRow" hidden>
        <div class="row-2">
          <label for="dotColor2">Color final:
            <input type="color" id="dotColor2" value="#155eef">
          </label>
          <label for="gradAngle">Ángulo: <output id="gradAngleVal" for="gradAngle">45°</output>
            <input type="range" id="gradAngle" min="0" max="360" step="5" value="45">
          </label>
        </div>
      </div>

      <div class="row-2">
        <label for="cornerSqType">Ojos externos:
          <select id="cornerSqType">
            <option value="square" selected>Cuadrados</option>
            <option value="extra-rounded">Redondeados</option>
            <option value="dot">Circulares</option>
          </select>
        </label>
        <label for="cornerSqColor">Color:
          <input type="color" id="cornerSqColor" value="#182230">
        </label>
      </div>

      <div class="row-2">
        <label for="cornerDotType">Ojos internos (inline):
          <select id="cornerDotType">
            <option value="square" selected>Cuadrados</option>
            <option value="dot">Circulares</option>
          </select>
        </label>
        <label for="cornerDotColor">Color:
          <input type="color" id="cornerDotColor" value="#182230">
        </label>
      </div>

      <div class="row-2">
        <label for="bgColor">Color de fondo:
          <input type="color" id="bgColor" value="#ffffff">
        </label>
      </div>

      <label class="check-row" for="useShadow">
        <input type="checkbox" id="useShadow">
        Sombra
      </label>
      <div id="shadowRow" hidden>
        <div class="row-2">
          <label for="shadowColor">Color de sombra:
            <input type="color" id="shadowColor" value="#0a2472">
          </label>
          <label for="shadowAngle">Ángulo: <output id="shadowAngleVal" for="shadowAngle">45°</output>
            <input type="range" id="shadowAngle" min="0" max="360" step="5" value="45">
          </label>
        </div>
        <div class="row-2">
          <label for="shadowDist">Distancia: <output id="shadowDistVal" for="shadowDist">12px</output>
            <input type="range" id="shadowDist" min="0" max="40" step="1" value="12">
          </label>
          <label for="shadowBlur">Grosor (blur): <output id="shadowBlurVal" for="shadowBlur">16px</output>
            <input type="range" id="shadowBlur" min="0" max="40" step="1" value="16">
          </label>
        </div>
        <p class="hint">La sombra se ve en pantalla y se hornea en el PNG. En SVG se descarga plano (el vector no guarda sombra raster).</p>
      </div>
    </fieldset>

    <section class="qr-wrap" aria-live="polite">
      <p id="placeholder">Aquí aparecerá tu código QR</p>
      
      <div class="qr-container" id="qr-container" style="display: none;">
        <div id="qrcode"></div>
      </div>
    </section>

    <!-- Botones para descargar la imagen final -->
    <div class="action-buttons" style="flex-wrap: wrap;">
      <label for="fileName" style="flex: 1 1 100%; font-size: 0.9rem; color: var(--muted); text-align: left;">Nombre del archivo:
        <input type="text" id="fileName" value="mi-codigo-qr" maxlength="60" autocomplete="off"
          style="display: block; width: 100%; margin-top: 0.3rem; border-radius: 12px; border: 1px solid #bfd3ff; padding: 0.7rem 0.9rem; font-size: 1rem; color: var(--text); background: #fbfdff; outline: none;">
      </label>
      <button type="button" id="downloadBtn" style="display: none;">⬇️ Descargar QR (PNG)</button>
      <button type="button" id="downloadSvgBtn" style="display: none;">⬇️ SVG</button>
    </div>
  </main>

  <!-- Librería vendorizada: qr-code-styling v1.9.1 (sin dependencia de CDN) -->
  <script src="./vendor/qr-code-styling.js"></script>
  <script>
    let logoDataUrl = ''; // DataURL del logo (la lib lo compone sin deformar)
    let qrCode = null;
    let currentData = '';
    const MAX_LOGO_BYTES = 2 * 1024 * 1024; // 2 MB
    const QR_SIZE = 300;

    function setLogoStatus(msg) {
      document.getElementById('logoStatus').textContent = msg;
    }

    function clearLogo(showMessage) {
      logoDataUrl = '';
      document.getElementById('logoInput').value = '';
      document.getElementById('logoTools').hidden = true;
      if (showMessage) setLogoStatus('');
      if (qrCode && currentData) {
        qrCode.update({ image: '' });
        applyShadowPreview();
      }
    }

    function getImageOptions() {
      return {
        hideBackgroundDots: document.getElementById('hideDots').checked,
        imageSize: parseFloat(document.getElementById('logoSize').value),
        margin: parseInt(document.getElementById('logoMargin').value, 10),
        crossOrigin: 'anonymous'
      };
    }

    function refreshLogoOutputs() {
      document.getElementById('logoSizeVal').textContent =
        Math.round(parseFloat(document.getElementById('logoSize').value) * 100) + '%';
      document.getElementById('logoMarginVal').textContent =
        document.getElementById('logoMargin').value + 'px';
    }

    function applyImageOptions() {
      refreshLogoOutputs();
      if (qrCode && currentData) {
        qrCode.update({ imageOptions: getImageOptions() });
        applyShadowPreview();
      }
    }

    function createQrInstance(data) {
      const style = getStyleOptions();
      lastGradientOn = document.getElementById('useGradient').checked;
      qrCode = new QRCodeStyling({
        width: QR_SIZE,
        height: QR_SIZE,
        type: 'canvas',
        data: data,
        image: logoDataUrl || '',
        qrOptions: {
          errorCorrectionLevel: 'H' // Nivel H: VITAL para que siga legible con logo
        },
        imageOptions: getImageOptions(),
        dotsOptions: style.dotsOptions,
        cornersSquareOptions: style.cornersSquareOptions,
        cornersDotOptions: style.cornersDotOptions,
        backgroundOptions: style.backgroundOptions
      });
      const container = document.getElementById('qrcode');
      container.innerHTML = '';
      qrCode.append(container);
      applyShadowPreview();
    }

    // ---- Estilo y efectos ----
    let lastGradientOn = false;

    // Hex oficiales de Materialize (sass/components/_color-variables.scss):
    // puntos en darken-4 sobre fondo lighten-5 para mantener contraste de lectura.
    const MATERIAL_PRESETS = [
      { name: 'Clásico',   dots: '#212121', bg: '#FFFFFF' },
      { name: 'Océano',    dots: '#0D47A1', bg: '#E3F2FD' },
      { name: 'Esmeralda', dots: '#004D40', bg: '#E0F2F1' },
      { name: 'Violeta',   dots: '#311B92', bg: '#EDE7F6' },
      { name: 'Atardecer', dots: '#BF360C', bg: '#FFF3E0' },
      { name: 'Carbón',    dots: '#263238', bg: '#ECEFF1' },
      { name: 'Rosa',      dots: '#880E4F', bg: '#FCE4EC' },
      { name: 'Bosque',    dots: '#1B5E20', bg: '#E8F5E9' }
    ];

    function renderPaletteGrid() {
      const grid = document.getElementById('paletteGrid');
      MATERIAL_PRESETS.forEach(function(p) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'swatch';
        btn.setAttribute('aria-pressed', 'false');
        btn.setAttribute('aria-label', 'Paleta ' + p.name);
        btn.title = p.name + ' (' + p.dots + ' / ' + p.bg + ')';
        const chip = document.createElement('span');
        chip.style.background = 'linear-gradient(135deg, ' + p.dots + ' 50%, ' + p.bg + ' 50%)';
        const caption = document.createElement('small');
        caption.textContent = p.name;
        btn.appendChild(chip);
        btn.appendChild(caption);
        btn.addEventListener('click', function() {
          applyPalette(p, btn);
        });
        grid.appendChild(btn);
      });
    }

    function applyPalette(p, btn) {
      document.getElementById('dotColor').value = p.dots;
      document.getElementById('cornerSqColor').value = p.dots;
      document.getElementById('cornerDotColor').value = p.dots;
      document.getElementById('bgColor').value = p.bg;
      document.querySelectorAll('#paletteGrid .swatch').forEach(function(s) {
        s.setAttribute('aria-pressed', s === btn ? 'true' : 'false');
      });
      applyStyleOptions();
    }

    function getStyleOptions() {
      const useGrad = document.getElementById('useGradient').checked;
      const c1 = document.getElementById('dotColor').value;
      const c2 = document.getElementById('dotColor2').value;
      return {
        dotsOptions: {
          type: document.getElementById('dotType').value,
          color: c1,
          roundSize: true,
          gradient: useGrad ? {
            type: 'linear',
            rotation: parseInt(document.getElementById('gradAngle').value, 10) * Math.PI / 180,
            colorStops: [
              { offset: 0, color: c1 },
              { offset: 1, color: c2 }
            ]
          } : undefined
        },
        cornersSquareOptions: {
          type: document.getElementById('cornerSqType').value,
          color: document.getElementById('cornerSqColor').value
        },
        cornersDotOptions: {
          type: document.getElementById('cornerDotType').value,
          color: document.getElementById('cornerDotColor').value
        },
        backgroundOptions: {
          color: document.getElementById('bgColor').value
        }
      };
    }

    function getShadowSettings() {
      const angle = parseInt(document.getElementById('shadowAngle').value, 10) * Math.PI / 180;
      const dist = parseInt(document.getElementById('shadowDist').value, 10);
      return {
        on: document.getElementById('useShadow').checked,
        color: document.getElementById('shadowColor').value,
        blur: parseInt(document.getElementById('shadowBlur').value, 10),
        offsetX: Math.cos(angle) * dist,
        offsetY: Math.sin(angle) * dist
      };
    }

    function refreshStyleOutputs() {
      document.getElementById('gradAngleVal').textContent = document.getElementById('gradAngle').value + '°';
      document.getElementById('shadowAngleVal').textContent = document.getElementById('shadowAngle').value + '°';
      document.getElementById('shadowDistVal').textContent = document.getElementById('shadowDist').value + 'px';
      document.getElementById('shadowBlurVal').textContent = document.getElementById('shadowBlur').value + 'px';
    }

    function applyShadowPreview() {
      const canvas = document.querySelector('#qrcode canvas');
      if (!canvas) return;
      const sh = getShadowSettings();
      canvas.style.filter = sh.on
        ? 'drop-shadow(' + sh.offsetX.toFixed(1) + 'px ' + sh.offsetY.toFixed(1) + 'px ' + sh.blur + 'px ' + sh.color + ')'
        : '';
    }

    function applyStyleOptions() {
      refreshStyleOutputs();
      if (!qrCode || !currentData) return;
      // El merge interno de update() no limpia un degradado ya aplicado:
      // si el toggle cambió, recreamos la instancia para un estado determinístico.
      const gradOn = document.getElementById('useGradient').checked;
      if (gradOn !== lastGradientOn) {
        createQrInstance(currentData);
        return;
      }
      const style = getStyleOptions();
      qrCode.update({
        dotsOptions: style.dotsOptions,
        cornersSquareOptions: style.cornersSquareOptions,
        cornersDotOptions: style.cornersDotOptions,
        backgroundOptions: style.backgroundOptions
      });
      applyShadowPreview();
    }

    // 1. Manejar la carga de la imagen (se guarda como DataURL, la lib la encaja con su aspecto)
    document.getElementById('logoInput').addEventListener('change', function(e) {
      const file = e.target.files[0];

      if (!file) {
        clearLogo(true);
        return;
      }

      if (!file.type.startsWith('image/')) {
        alert('El archivo debe ser una imagen.');
        clearLogo(true);
        return;
      }

      if (file.size > MAX_LOGO_BYTES) {
        alert('La imagen es muy pesada (máx. 2 MB). Elegí una más liviana.');
        clearLogo(true);
        return;
      }

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          logoDataUrl = event.target.result;
          setLogoStatus('Logo cargado: ' + file.name + ' — ajustalo abajo, se aplica al instante si ya hay QR.');
          document.getElementById('logoTools').hidden = false;
          refreshLogoOutputs();
          if (qrCode && currentData) {
            qrCode.update({ image: logoDataUrl, imageOptions: getImageOptions() });
            applyShadowPreview();
          }
        };
        img.onerror = function() {
          alert('No se pudo leer esa imagen. Probá con otro archivo.');
          clearLogo(true);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function normalizeUrl(raw) {
      let value = raw.trim();
      // Si parece dominio sin esquema, agregamos https://
      if (value && !/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(value)) {
        value = 'https://' + value;
      }
      return value;
    }

    function showEmptyState(msg, focusInput) {
      const input = document.getElementById('linkInput');
      if (msg) alert(msg);
      if (focusInput) input.focus();
      document.getElementById('placeholder').style.display = 'block';
      document.getElementById('qr-container').style.display = 'none';
      document.getElementById('downloadBtn').style.display = 'none';
      document.getElementById('downloadSvgBtn').style.display = 'none';
    }

    // 2. Generar el QR
    function generateQRCode() {
      if (typeof QRCodeStyling === 'undefined') {
        alert('No cargó la librería local (qr/vendor/qr-code-styling.js). Revisá que el archivo exista.');
        return;
      }

      const input = document.getElementById('linkInput');
      const rawLink = input.value;
      const link = normalizeUrl(rawLink);

      if (!rawLink.trim()) {
        showEmptyState('Por favor, escribe un enlace válido.', true);
        return;
      }

      try {
        const parsed = new URL(link);
        if (!['http:', 'https:'].includes(parsed.protocol)) {
          throw new Error('bad-protocol');
        }
        input.value = link; // muestra la URL normalizada
      } catch (err) {
        showEmptyState('Ese enlace no parece válido. Ejemplo: https://example.com', true);
        return;
      }

      try {
        currentData = link;
        createQrInstance(link);
      } catch (err) {
        showEmptyState('El texto es demasiado largo para generar un QR. Probá con un enlace más corto.', false);
        return;
      }

      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('qr-container').style.display = 'inline-block';
      document.getElementById('downloadBtn').style.display = 'inline-block';
      document.getElementById('downloadSvgBtn').style.display = 'inline-block';
    }

    // 3. Descarga directa con la librería (ya incluye el logo compuesto)
    function getFileName() {
      const raw = document.getElementById('fileName').value.trim() || 'mi-codigo-qr';
      // Saneamos: sin extensión, sin caracteres inválidos para archivos
      return raw.replace(/\.[a-z0-9]+$/i, '').replace(/[\\/:*?"<>|]/g, '').trim() || 'mi-codigo-qr';
    }

    function downloadQR(extension) {
      if (!qrCode || !currentData) return alert('Primero genera un código QR.');
      const ext = extension || 'png';
      // La sombra es raster: solo se puede hornear en PNG. En SVG se descarga plano.
      if (ext === 'png' && getShadowSettings().on) {
        downloadPngWithShadow();
        return;
      }
      qrCode.download({ name: getFileName(), extension: ext })
        .catch(function() {
          alert('No se pudo descargar el QR. Intentá generar de nuevo.');
        });
    }

    // Hornea la sombra en el PNG: compone el QR sobre un canvas transparente
    // con padding, usando la API de sombras del canvas 2D.
    function downloadPngWithShadow() {
      const sh = getShadowSettings();
      qrCode.getRawData('png').then(function(blob) {
        if (!blob) throw new Error('empty');
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = function() {
          try {
            const pad = Math.ceil(sh.blur + Math.max(Math.abs(sh.offsetX), Math.abs(sh.offsetY)) + 8);
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = QR_SIZE + pad * 2;
            finalCanvas.height = QR_SIZE + pad * 2;
            const ctx = finalCanvas.getContext('2d');
            ctx.shadowColor = sh.color;
            ctx.shadowBlur = sh.blur;
            ctx.shadowOffsetX = sh.offsetX;
            ctx.shadowOffsetY = sh.offsetY;
            ctx.drawImage(img, pad, pad, QR_SIZE, QR_SIZE);
            const link = document.createElement('a');
            link.download = getFileName() + '.png';
            link.href = finalCanvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          } finally {
            URL.revokeObjectURL(url);
          }
        };
        img.onerror = function() {
          URL.revokeObjectURL(url);
          alert('No se pudo componer la sombra. Intentá generar de nuevo.');
        };
        img.src = url;
      }).catch(function() {
        alert('No se pudo descargar el QR. Intentá generar de nuevo.');
      });
    }

    // Permitir presionar "Enter" en el input
    document.getElementById('linkInput').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        generateQRCode();
      }
    });

    document.getElementById('generateBtn').addEventListener('click', generateQRCode);
    document.getElementById('downloadBtn').addEventListener('click', function() { downloadQR('png'); });
    document.getElementById('downloadSvgBtn').addEventListener('click', function() { downloadQR('svg'); });
    document.getElementById('logoSize').addEventListener('input', applyImageOptions);
    document.getElementById('logoMargin').addEventListener('input', applyImageOptions);
    document.getElementById('hideDots').addEventListener('change', applyImageOptions);
    document.getElementById('removeLogoBtn').addEventListener('click', function() {
      clearLogo(true);
      setLogoStatus('Logo quitado. Podés subir otro si querés.');
    });
    // Controles de estilo y efectos (aplican en vivo si ya hay QR)
    ['dotType', 'dotColor', 'dotColor2', 'gradAngle', 'cornerSqType', 'cornerSqColor',
     'cornerDotType', 'cornerDotColor', 'bgColor'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', applyStyleOptions);
    });
    document.getElementById('useGradient').addEventListener('change', function() {
      document.getElementById('gradientRow').hidden = !this.checked;
      applyStyleOptions();
    });
    ['shadowColor', 'shadowAngle', 'shadowDist', 'shadowBlur'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', applyStyleOptions);
    });
    document.getElementById('useShadow').addEventListener('change', function() {
      document.getElementById('shadowRow').hidden = !this.checked;
      applyStyleOptions();
    });
    refreshLogoOutputs();
    refreshStyleOutputs();
    renderPaletteGrid();
  </script>

</body>
