<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Codigo QR</title>
  <style>
    :root {
      --bg-1: #f3f8ff;
      --bg-2: #dce8ff;
      --card: #ffffff;
      --text: #182230;
      --muted: #5a6b82;
      --primary: #155eef;
      --primary-strong: #004ee8;
      --shadow: 0 20px 50px rgba(21, 94, 239, 0.2);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, #b6d0ff 0, transparent 35%),
        radial-gradient(circle at 85% 80%, #8ec5ff 0, transparent 30%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
    }

    .app {
      width: min(760px, 100%);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(1.2rem, 3.5vw, 2.2rem);
      border: 1px solid #e5edff;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2rem);
      letter-spacing: 0.01em;
    }

    .subtitle {
      margin-top: 0.5rem;
      margin-bottom: 1.25rem;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .form-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    #linkInput {
      flex: 1;
      min-width: 250px;
      border-radius: 12px;
      border: 1px solid #bfd3ff;
      padding: 0.85rem 0.95rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      color: var(--text);
      background: #fbfdff;
    }

    #linkInput:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(21, 94, 239, 0.14);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      white-space: nowrap;
    }

    button:hover {
      filter: brightness(1.03);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .qr-wrap {
      margin-top: 1.35rem;
      border-radius: 16px;
      border: 1px dashed #bfd3ff;
      background: #f9fbff;
      min-height: 310px;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    #placeholder {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    #qrcode {
      display: grid;
      place-items: center;
    }

    #qrcode img,
    #qrcode canvas {
      border-radius: 10px;
      box-shadow: 0 10px 26px rgba(0, 38, 120, 0.18);
      background: #fff;
      padding: 0.65rem;
    }

    @media (max-width: 560px) {
      .app {
        border-radius: 18px;
        padding: 1rem;
      }

      .form-row {
        flex-direction: column;
      }

      #linkInput {
        min-width: 0;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <main class="app">
    <h1>Generador de Codigo QR</h1>
    <p class="subtitle">Escribe un enlace y genera un codigo QR limpio, rapido y listo para compartir.</p>

    <div class="form-row">
      <input type="text" id="linkInput" placeholder="https://example.com">
      <button onclick="generateQRCode()">Generar QR</button>
    </div>

    <section class="qr-wrap">
      <p id="placeholder">Aqui aparecera tu codigo QR</p>
      <div id="qrcode"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <script>
    function generateQRCode() {
      const link = document.getElementById('linkInput').value;
      const qrContainer = document.getElementById('qrcode');
      const placeholder = document.getElementById('placeholder');

      qrContainer.innerHTML = '';

      if (!link.trim()) {
        alert('Por favor, escribe un enlace valido.');
        placeholder.style.display = 'block';
        return;
      }

      placeholder.style.display = 'none';

      new QRCode(qrContainer, {
        text: link,
        width: 256,
        height: 256,
      });
    }

    document.getElementById('linkInput').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        generateQRCode();
      }
    });
  </script>

</body>
</html>
